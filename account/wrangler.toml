name = "elsewhere-account"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Secrets, set once per deploy: `wrangler secret put RESEND_KEY`, `wrangler secret put MAIL_FROM`
# (e.g. "Elsewhere <hello@elsewhere.app>"), `wrangler secret put LINK_BASE` (e.g. "https://vsvinav.github.io/elsewhere/v3/").

# The web and Android OAuth client IDs from Google Cloud Console, comma-separated. No client secret is needed.
[vars]
GOOGLE_CLIENT_ID = "1055778589174-rffhd48tslir3haamis71o6djdibdl68.apps.googleusercontent.com"

[[kv_namespaces]]
binding = "ACCOUNTS"
id = "9b618aa442fe4b49821698d5bf49a229"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
