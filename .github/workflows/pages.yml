name: Pages

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # One site, two builds: main at the root, the v2 preview under /v2/.
  build:
    strategy:
      matrix:
        include:
          - ref: main
            out: .
          - ref: v2
            out: v2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The crew e2e test starts the relay Worker in-process; v2 ships one, main does not.
      - if: hashFiles('relay/package-lock.json') != ''
        run: npm ci
        working-directory: relay
      - run: npm test
        env:
          CI: true
      # Bake the synthetic demo record (Ada, eighteen months in Lisbon) so visitors without an export can try the site.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q . && python3 scripts/make_sample.py --out web/public/data
        working-directory: .
      # Keys are optional: without them the site still imports a record and draws OpenStreetMap tiles.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/${{ matrix.out == '.' && '' || format('{0}/', matrix.out) }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ secrets.VITE_GOOGLE_MAP_ID }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.ref }}
          path: web/dist

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-main
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: site-v2
          path: site/v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
