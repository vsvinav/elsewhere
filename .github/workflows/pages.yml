name: Pages

on:
  push:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # One site, one build: v3 under /v3/. The root and /v2/ only forward there, so a login
  # cannot leak into an older build that shares this origin's storage.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The crew e2e test starts the relay Worker in-process; v2 ships one, main does not.
      - if: hashFiles('relay/package-lock.json') != ''
        run: npm ci
        working-directory: relay
      # Likewise the account e2e test starts the account Worker in-process; v3 ships one.
      - if: hashFiles('account/package-lock.json') != ''
        run: npm ci
        working-directory: account
      - run: npm test
        env:
          CI: true
      # Bake the synthetic demo record (Ada, eighteen months in Lisbon) so visitors without an export can try the site.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q . && python3 scripts/make_sample.py --out web/public/data
        working-directory: .
      # Keys are optional: without them the site still imports a record and draws OpenStreetMap tiles.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/v3/
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ secrets.VITE_GOOGLE_MAP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-artifact@v4
        with:
          name: site-v3
          path: web/dist

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-v3
          path: site/v3
      - run: |
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Elsewhere</title>
          <meta http-equiv="refresh" content="0; url=/elsewhere/v3/">
          <script>location.replace('/elsewhere/v3/')</script>
          <a href="/elsewhere/v3/">Elsewhere has moved</a>
          HTML
          mkdir -p site/v2 && cp site/index.html site/v2/index.html
          # Pages only reads the root 404; v3's copy of its index keeps deep links inside the app.
          cp site/v3/404.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
