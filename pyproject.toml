[project]
name = "timeline-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["reverse_geocoder>=1.5.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
